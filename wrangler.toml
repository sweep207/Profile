name = "locket-plus-api"
main = "worker.js"
compatibility_date = "2026-11-07"

[[d1_databases]]
binding = "DB"
database_name = "locket-plus-orders"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
# Điền domain GitHub Pages của bạn, ví dụ:
# ALLOWED_ORIGINS = "https://sweep207.github.io"
# BANK_ID = "MB"
# BANK_ACCOUNT = "YOUR_ACCOUNT_NUMBER"
# BANK_ACCOUNT_NAME = "YOUR_ACCOUNT_NAME"

[[r2_buckets]]
binding = "FRAMES_BUCKET"
bucket_name = "locket-widget-frames"
